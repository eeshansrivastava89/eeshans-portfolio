name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours (refreshes content snapshots and rebuilds)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-deploy-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ─────────────────────────────────────────────────────────────
  # One job per content source, so a failure names its source in the
  # run list and the failure email. All of them are skipped on push,
  # which already carries its own content.
  #
  # They are chained rather than parallel (needs + !cancelled())
  # because every one of them writes a commit to main: the chain is
  # write ordering, and !cancelled() keeps a failed source from
  # skipping the next one. Each job starts from main's tip, so it
  # sees the previous job's commit.
  # ─────────────────────────────────────────────────────────────
  refresh-substack:
    name: Refresh Substack snapshot
    runs-on: ubuntu-latest
    if: github.event_name != 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No install: the script shells out to curl and uses Node built-ins.
      - name: Refresh Substack feed snapshot
        run: pnpm refresh:substack

      - name: Commit Substack snapshot
        run: |
          git add .cache/substack-feed.json
          if git diff --cached --quiet; then
            echo "Substack snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh substack snapshot [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  refresh-wordpress:
    name: Refresh WordPress snapshot
    runs-on: ubuntu-latest
    needs: refresh-substack
    if: ${{ !cancelled() }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh WordPress posts snapshot
        run: pnpm refresh:wordpress

      - name: Commit WordPress snapshot
        run: |
          git add src/content/blog
          if git diff --cached --quiet; then
            echo "WordPress snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh wordpress snapshot [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  # ─────────────────────────────────────────────────────────────
  # Build and ship. Independent of the refresh outcomes: the newest
  # committed snapshots deploy even while a source is down, and
  # typechecking always runs before anything ships.
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    needs: [refresh-substack, refresh-wordpress]
    if: ${{ !cancelled() }}

    steps:
      # `ref: main` picks up the snapshot commits the refresh jobs just
      # pushed; the default SHA would be the commit that triggered the
      # run and would deploy one cycle stale.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm astro check

      - name: Validate analytics config
        run: |
          if [ "$PUBLIC_ENABLE_ANALYTICS" = "true" ]; then
            if [ -z "$PUBLIC_POSTHOG_KEY" ]; then
              echo "::error::PUBLIC_ENABLE_ANALYTICS is true but PUBLIC_POSTHOG_KEY secret is missing."
              exit 1
            fi
            if [ -z "$PUBLIC_POSTHOG_HOST" ]; then
              echo "::error::PUBLIC_ENABLE_ANALYTICS is true but PUBLIC_POSTHOG_HOST secret is missing."
              exit 1
            fi
            if [ -z "$PUBLIC_ANALYTICS_ALLOWED_HOSTS" ]; then
              echo "::error::PUBLIC_ENABLE_ANALYTICS is true but PUBLIC_ANALYTICS_ALLOWED_HOSTS variable is missing."
              exit 1
            fi
          else
            echo "Analytics disabled — skipping validation."
          fi
        env:
          PUBLIC_ENABLE_ANALYTICS: ${{ vars.PUBLIC_ENABLE_ANALYTICS }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}
          PUBLIC_ANALYTICS_ALLOWED_HOSTS: ${{ vars.PUBLIC_ANALYTICS_ALLOWED_HOSTS }}

      - name: Deploy to Fly.io
        run: >
          flyctl deploy --remote-only
          --build-arg PUBLIC_POSTHOG_KEY="$PUBLIC_POSTHOG_KEY"
          --build-arg PUBLIC_POSTHOG_HOST="$PUBLIC_POSTHOG_HOST"
          --build-arg PUBLIC_POSTHOG_UI_HOST="$PUBLIC_POSTHOG_UI_HOST"
          --build-arg PUBLIC_ANALYTICS_ALLOWED_HOSTS="$PUBLIC_ANALYTICS_ALLOWED_HOSTS"
          --build-secret GITHUB_TOKEN="$BUILD_GITHUB_TOKEN"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          BUILD_GITHUB_TOKEN: ${{ secrets.BUILD_GITHUB_TOKEN }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}
          PUBLIC_POSTHOG_UI_HOST: ${{ vars.PUBLIC_POSTHOG_UI_HOST || 'https://us.posthog.com' }}
          PUBLIC_ANALYTICS_ALLOWED_HOSTS: ${{ vars.PUBLIC_ANALYTICS_ALLOWED_HOSTS }}
